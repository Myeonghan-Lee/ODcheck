<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 문서 변동사항 탐지기 (Serverless)</title>
    <!-- 라이브러리 로드 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript" onload="onOpenCvReady();"></script>
    
    <style>
        body { background-color: #f8f9fa; }
        .canvas-container { position: relative; display: inline-block; width: 100%; }
        canvas { max-width: 100%; height: auto; border: 1px solid #ccc; background: white; }
        .loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 1000; text-align: center; padding-top: 20%;
        }
        .status-msg { font-weight: bold; color: #0d6efd; }
    </style>
</head>
<body>

<div id="loader" class="loading-overlay">
    <div class="spinner-border text-primary" role="status"></div>
    <div id="statusMsg" class="mt-3 status-msg">OpenCV 로딩 중...</div>
</div>

<div class="container py-5">
    <h2 class="text-center mb-4">📑 스마트 문서 변동사항 탐지기</h2>
    <p class="text-center text-muted">GitHub Pages 전용 (서버 없이 브라우저에서 분석)</p>

    <div class="card p-4 mb-4 shadow-sm">
        <label class="form-label">비교할 이미지 업로드 (좌우 병합본)</label>
        <input type="file" id="fileInput" class="form-control" accept="image/*">
        <button id="processBtn" class="btn btn-primary mt-3 w-100" disabled>분석 시작</button>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card p-2">
                <h6>원본 (왼쪽)</h6>
                <canvas id="canvasLeft"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card p-2">
                <h6>수정 및 감지 (오른쪽)</h6>
                <canvas id="canvasResult"></canvas>
            </div>
        </div>
    </div>

    <div class="card p-4 shadow-sm">
        <h4>🔍 변경 내용 리스트</h4>
        <ul id="textList" class="list-group list-group-flush">
            <li class="list-group-item text-muted">분석 결과가 여기에 표시됩니다.</li>
        </ul>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const statusMsg = document.getElementById('statusMsg');
    const loader = document.getElementById('loader');

    function onOpenCvReady() {
        statusMsg.innerText = "준비 완료";
        processBtn.disabled = false;
        loader.style.display = 'none';
    }

    processBtn.onclick = async () => {
        if (!fileInput.files[0]) return alert("파일을 선택하세요.");
        
        loader.style.display = 'block';
        statusMsg.innerText = "이미지 읽는 중...";

        const img = await loadImage(fileInput.files[0]);
        
        // 1. 이미지 분할
        let fullMat = cv.imread(img);
        let width = fullMat.cols;
        let height = fullMat.rows;
        let mid = Math.floor(width / 2);

        let rectLeft = new cv.Rect(0, 0, mid, height);
        let rectRight = new cv.Rect(mid, 0, mid, height);
        
        let matLeft = fullMat.roi(rectLeft);
        let matRight = fullMat.roi(rectRight);

        statusMsg.innerText = "이미지 정렬 및 차이 분석 중...";
        
        // 2. 차이점 마스크 생성 (간소화된 방식)
        let grayLeft = new cv.Mat();
        let grayRight = new cv.Mat();
        cv.cvtColor(matLeft, grayLeft, cv.COLOR_RGBA2GRAY);
        cv.cvtColor(matRight, grayRight, cv.COLOR_RGBA2GRAY);

        let diff = new cv.Mat();
        cv.absdiff(grayLeft, grayRight, diff);
        cv.threshold(diff, diff, 30, 255, cv.THRESH_BINARY);

        let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(20, 5));
        cv.dilate(diff, diff, kernel);

        // 3. 컨투어 추출 및 OCR
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();
        cv.findContours(diff, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        const textList = document.getElementById('textList');
        textList.innerHTML = "";
        
        statusMsg.innerText = "텍스트 인식 중 (Tesseract)...";
        
        let resultMat = matRight.clone();

        for (let i = 0; i < contours.size(); ++i) {
            let rect = cv.boundingRect(contours.get(i));
            if (rect.width > 30 && rect.height > 10) {
                // 빨간 박스 그리기
                let point1 = new cv.Point(rect.x, rect.y);
                let point2 = new cv.Point(rect.x + rect.width, rect.y + rect.height);
                cv.rectangle(resultMat, point1, point2, [255, 0, 0, 255], 2);

                // 영역 잘라서 OCR (Tesseract.js)
                let roi = matRight.roi(rect);
                let canvasROI = document.createElement('canvas');
                cv.imshow(canvasROI, roi);
                
                const { data: { text } } = await Tesseract.recognize(canvasROI, 'kor+eng');
                
                if (text.trim()) {
                    let li = document.createElement('li');
                    li.className = "list-group-item list-group-item-info mb-1";
                    li.innerText = `[구간 ${i+1}] ${text.trim()}`;
                    textList.appendChild(li);
                }
                roi.delete();
            }
        }

        // 결과 화면 표시
        cv.imshow('canvasLeft', matLeft);
        cv.imshow('canvasResult', resultMat);

        // 메모리 해제
        fullMat.delete(); matLeft.delete(); matRight.delete(); 
        grayLeft.delete(); grayRight.delete(); diff.delete();
        contours.delete(); hierarchy.delete(); resultMat.delete();
        
        loader.style.display = 'none';
    };

    function loadImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
